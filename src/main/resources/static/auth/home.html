<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webpage Title</title>
    
    <!-- Link to your external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>home page!</h1>
    <p id="home.sessionid"></p>
    <p id="home.username"></p>
</body>

<script>
    const getCookieValue = (name) => (
    document.cookie
    .split('; ')
    .find(row => row.startsWith(`${name}=`))
    ?.split('=')[1]
);

document.getElementById("home.sessionid").value = getCookieValue("JSESSIONID");
</script>
</html>
